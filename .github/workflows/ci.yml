name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  sdk:
    name: SDK / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x86_64-gcc}
          - {os: ubuntu-24.04-arm, platform: linux-aarch64-gcc}
          - {os: windows-2022, platform: windows-x64-msvc}
          - {os: macos-15-intel, platform: macos-x86_64-appleclang}
          - {os: macos-15, platform: macos-arm64-appleclang}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python -m pip install cmake==3.26.4 ninja
      - run: python .github/scripts/setup_openmp.py
      - run: python .github/scripts/build_sdk.py --platform ${{ matrix.platform }}
  static:
    name: Static / ${{ matrix.os }} / CMake 3.26
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python -m pip install cmake==3.26.4 ninja
      - run: python .github/scripts/setup_openmp.py
      - run: python .github/scripts/build_sdk.py --platform static --static --config Debug
  wheels:
    name: Wheels / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python .github/scripts/setup_openmp.py
      - uses: pypa/cibuildwheel@v4.3.5
  source:
    name: Source distribution round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install build pytest numpy
      - name: Build sdist, then build and install its wheel
        run: |
          python -m build --sdist
          mkdir unpacked
          tar -xf dist/*.tar.gz -C unpacked --strip-components=1
          python -m pip install ./unpacked
          cd /tmp
          OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE python -m pytest --pyargs myproject.tests
          python "$GITHUB_WORKSPACE/examples/python/assign_points.py" --samples 1000 --threads 2
      - name: Verify initialized template
        run: |
          python unpacked/script/init_project.py --name renamed_demo --distribution renamed-demo
          python -m pip install ./unpacked
          cd /tmp
          OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE python -m pytest --pyargs renamed_demo.tests
  release:
    name: Publish release notes
    needs: [sdk, static, wheels, source]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Validate version and publish notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py
