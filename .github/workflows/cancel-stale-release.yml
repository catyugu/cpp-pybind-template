name: Cancel superseded release candidate
on:
  push:
    branches: [main]
    paths: [.github/workflows/cancel-stale-release.yml]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Stop the candidate superseded by the notice formatting fix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/actions/runs/41746811665/cancel"
